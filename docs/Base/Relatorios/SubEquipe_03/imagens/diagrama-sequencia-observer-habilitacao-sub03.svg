<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="solid" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#333"/></marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#333" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1080" height="560" fill="#fff"/>

  <g font-weight="bold" text-anchor="middle" font-size="12">
    <rect x="20"  y="20" width="100" height="36" fill="#eee" stroke="#333"/><text x="70"  y="43">: Client</text>
    <rect x="170" y="20" width="240" height="36" fill="#e8f0fa" stroke="#333"/><text x="290" y="43">acomp : AcompanhamentoHabilitacao</text>
    <rect x="450" y="20" width="200" height="36" fill="#e6f4e6" stroke="#333"/><text x="550" y="43">push : NotificacaoPush</text>
    <rect x="680" y="20" width="200" height="36" fill="#e6f4e6" stroke="#333"/><text x="780" y="43">email : NotificacaoEmail</text>
    <rect x="900" y="20" width="170" height="36" fill="#e6f4e6" stroke="#333"/><text x="985" y="43">aud : HistoricoAuditoria</text>
  </g>
  <g stroke="#333" stroke-dasharray="6,5">
    <line x1="70"  y1="56" x2="70"  y2="540"/>
    <line x1="290" y1="56" x2="290" y2="540"/>
    <line x1="550" y1="56" x2="550" y2="540"/>
    <line x1="780" y1="56" x2="780" y2="540"/>
    <line x1="985" y1="56" x2="985" y2="540"/>
  </g>

  <line x1="70" y1="95" x2="290" y2="95" stroke="#333" marker-end="url(#solid)"/>
  <text x="80" y="88" font-size="12">1: adicionar(push)</text>
  <line x1="70" y1="125" x2="290" y2="125" stroke="#333" marker-end="url(#solid)"/>
  <text x="80" y="118" font-size="12">2: adicionar(email)</text>
  <line x1="70" y1="155" x2="290" y2="155" stroke="#333" marker-end="url(#solid)"/>
  <text x="80" y="148" font-size="12">3: adicionar(aud)</text>

  <line x1="70" y1="200" x2="284" y2="200" stroke="#333" marker-end="url(#solid)"/>
  <text x="80" y="193" font-size="12">4: mudar_status("Definitiva")</text>
  <rect x="284" y="200" width="12" height="270" fill="#fff" stroke="#333"/>
  <text x="305" y="232" font-size="11" fill="#555">_status = novo_status</text>
  <text x="305" y="258" font-size="12">5: notificar()</text>

  <rect x="270" y="268" width="780" height="190" fill="none" stroke="#333"/>
  <path d="M270,268 h50 v16 l-8,8 h-42 z" fill="#eee" stroke="#333"/>
  <text x="278" y="282" font-size="11" font-weight="bold">loop</text>
  <text x="330" y="282" font-size="11">[para cada observador]</text>

  <line x1="296" y1="315" x2="550" y2="315" stroke="#333" marker-end="url(#solid)"/>
  <text x="320" y="308" font-size="12">6: atualizar(self)</text>
  <line x1="550" y1="340" x2="296" y2="340" stroke="#333" stroke-dasharray="5,4" marker-end="url(#open)"/>
  <text x="360" y="355" font-size="11" fill="#555">lê acomp.status</text>

  <line x1="296" y1="385" x2="780" y2="385" stroke="#333" marker-end="url(#solid)"/>
  <text x="320" y="378" font-size="12">7: atualizar(self)</text>

  <line x1="296" y1="425" x2="985" y2="425" stroke="#333" marker-end="url(#solid)"/>
  <text x="320" y="418" font-size="12">8: atualizar(self)</text>

  <line x1="284" y1="500" x2="70" y2="500" stroke="#333" stroke-dasharray="5,4" marker-end="url(#open)"/>
  <text x="140" y="493" font-size="11" fill="#555">9: (retorno)</text>
